name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Quality gates (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DATABASE_URL: "file:/tmp/ci.db"
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate Prisma schema
        run: pnpm exec prisma validate
      - name: Migrate (CI database)
        run: pnpm exec prisma migrate deploy
      - name: Seed (CI database)
        run: pnpm db:seed
      - name: Next.js build
        run: pnpm build

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DATABASE_URL: "file:/tmp/ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Migrate (CI database)
        run: pnpm exec prisma migrate deploy
      - name: Seed (CI database)
        run: pnpm exec prisma db seed
      - name: Run unit tests
        run: pnpm test:unit

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DATABASE_URL: "file:/tmp/e2e.db"
      AUTH_SECRET: "ci-e2e-secret-only"
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Migrate e2e database
        run: pnpm exec prisma migrate deploy
      - name: Seed e2e database
        run: pnpm db:seed
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm test:e2e

  docker:
    name: Image build + Trivy scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: secure-inventory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: image
          image-ref: secure-inventory:ci
          format: sarif
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          output: trivy-results.sarif
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          output: trivy-fs-results.sarif
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
        if: always()

  publish:
    name: Publish image (GHCR + OIDC)
    runs-on: ubuntu-latest
    needs: [docker, quality, e2e]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/sdm06/secure-supply-chain-inventory:latest
            ghcr.io/sdm06/secure-supply-chain-inventory:${{ github.sha }}
            ghcr.io/sdm06/secure-supply-chain-inventory:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest-gate:
    name: Manifest gate (kustomize + kubeconform)
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.27.2
      - name: Install kubeconform
        run: |
          curl -sfLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/kubeconform.tar.gz kubeconform
          kubeconform -v
      - name: Render and validate base + overlays
        run: |
          TAG="${{ github.sha }}"
          gate_failed=0
          for env in base overlays/dev overlays/prod; do
            # Resolve __TAG__ (prod pins it) into a temp copy, then render THAT,
            # so the gate validates the exact tag-resolved manifests the release
            # step will apply — never a stale literal placeholder.
            cp -R k8s/${env} /tmp/gate-${env////-}
            sed -i -e "s|__TAG__|${TAG}|g" $(find /tmp/gate-${env////-} -name kustomization.y*ml)
            kubectl kustomize --load-restrictor LoadRestrictionsNone \
              --reorder none /tmp/gate-${env////-} \
              | kubeconform -strict -summary >/dev/null || gate_failed=1
          done
          exit "$gate_failed"
