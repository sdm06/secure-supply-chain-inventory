name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Quality gates (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DATABASE_URL: "file:/tmp/ci.db"
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate Prisma schema
        run: pnpm exec prisma validate
      - name: Migrate (CI database)
        run: pnpm exec prisma migrate deploy
      - name: Seed (CI database)
        run: pnpm db:seed
      - name: Next.js build
        run: pnpm build

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DATABASE_URL: "file:/tmp/ci.db"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Migrate (CI database)
        run: pnpm exec prisma migrate deploy
      - name: Seed (CI database)
        run: pnpm exec prisma db seed
      - name: Run unit tests
        run: pnpm test:unit

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DATABASE_URL: "file:/tmp/e2e.db"
      AUTH_SECRET: "ci-e2e-secret-only"
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Migrate e2e database
        run: pnpm exec prisma migrate deploy
      - name: Seed e2e database
        run: pnpm db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright OS deps only
        run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Run Playwright tests
        run: pnpm test:e2e

  docker:
    name: Image build + Trivy scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: secure-inventory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (table, for logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-inventory:ci
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          output: trivy-table.txt
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
      - name: Print Trivy table
        run: cat trivy-table.txt
      - name: Trivy image scan (sarif, gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-inventory:ci
          format: sarif
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          output: trivy-results.sarif
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        if: always()

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          output: trivy-fs-results.sarif
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
        if: always()

  publish:
    name: Publish image (GHCR + OIDC)
    runs-on: ubuntu-latest
    needs: [docker, quality, e2e]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/sdm06/secure-supply-chain-inventory:latest
            ghcr.io/sdm06/secure-supply-chain-inventory:${{ github.sha }}
            ghcr.io/sdm06/secure-supply-chain-inventory:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest-gate:
    name: Manifest gate (kustomize + kubeconform)
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v6
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.27.2
      - name: Install kubeconform
        run: |
          curl -sfLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/kubeconform.tar.gz kubeconform
          kubeconform -v
      - name: Render and validate base + overlays
        run: |
          TAG="${{ github.sha }}"
          gate_failed=0

          # Copy the whole k8s/ tree ONCE, preserving the relative structure
          # between overlays/* and base. Overlay kustomization.yaml files
          # reference ../../base as a relative path — copying each env
          # folder out in isolation (as before) breaks that reference.
          rm -rf /tmp/gate-k8s
          cp -R k8s /tmp/gate-k8s

          # Resolve __TAG__ everywhere in the copied tree, so the gate
          # validates the exact tag-resolved manifests the release step
          # will apply — never a stale literal placeholder.
          find /tmp/gate-k8s -name 'kustomization.y*ml' \
            -exec sed -i -e "s|__TAG__|${TAG}|g" {} +

          for env in base overlays/dev overlays/prod; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone \
              /tmp/gate-k8s/${env} \
              | kubeconform -strict -summary >/dev/null || gate_failed=1
          done
          exit "$gate_failed"
