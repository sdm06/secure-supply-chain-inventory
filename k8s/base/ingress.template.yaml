# Rename to ingress.yaml when you know the real host. The Ingress is
# deliberately NOT in kustomization.yaml: enable it per-overlay so dev can run
# with a fake/self-signed host and prod with your real one, without either
# overlay inheriting the wrong cert/host by accident.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-supply-chain-inventory
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # TLS is terminated by the cluster Ingress controller using a certificate
  # you provision OUT-OF-BAND (e.g. cert-manager + Let's Encrypt, or a manually
  # installed Secret of type kubernetes.io/tls named `inventory-tls`).
  tls:
    - hosts:
        - __HOST__
      secretName: inventory-tls
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secure-supply-chain-inventory
                port:
                  name: http
