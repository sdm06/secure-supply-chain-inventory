apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-supply-chain-inventory
  labels:
    app.kubernetes.io/name: secure-supply-chain-inventory
    app.kubernetes.io/instance: base
    app.kubernetes.io/version: base
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-supply-chain-inventory
      app.kubernetes.io/instance: base
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-supply-chain-inventory
        app.kubernetes.io/instance: base
        app.kubernetes.io/version: base
      annotations:
        prometheus.io/scrape: "false"
        prometheus.io/port: ""
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: ghcr.io/sdm06/secure-supply-chain-inventory:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: file:/app/data/dev.db
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: inventory-secret
                  key: auth-secret
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: PORT
              value: "3000"
          # SQLite's prisma.cache + Next's on-disk cache both want /tmp scratch.
          volumeMounts:
            - { name: database, mountPath: "/app/data", subPath: "data" }
            - { name: tmp, mountPath: "/tmp" }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: inventory-data
        - name: tmp
          emptyDir: {}
