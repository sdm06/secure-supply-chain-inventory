# This is a TEMPLATE / example ONLY — it exists so `git grep AUTH_SECRET`
# returns a path, and so reviewers can see EXACTLY which keys the app needs.
#
# It is NEVER applied by Kustomize (not referenced from kustomization.yaml) and
# the value below is a placeholder. Create the real secret with:
#   kubectl -n supply-chain create secret generic inventory-secret \
#     --from-literal=auth-secret="$(openssl rand -base64 32)"
# The secret is created out-of-band (manually), so it is never committed.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secret
  labels:
    app.kubernetes.io/name: secure-supply-chain-inventory
type: Opaque
stringData:
  auth-secret: "PLEASE_CREATE_ME_OUT_OF_BAND"
