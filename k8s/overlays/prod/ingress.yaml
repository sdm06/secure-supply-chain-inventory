# Prod Ingress — host + TLS are environment data, so they only exist here.
# The TLS certificate is a PRE-EXISTING kubernetes.io/tls Secret that you
# provision out-of-band (name: inventory-tls, below). No cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-supply-chain-inventory
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - inventory.prod.example.com
      secretName: inventory-tls
  rules:
    - host: inventory.prod.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secure-supply-chain-inventory
                port:
                  name: http
